name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: npm run lint 2>&1 | tee eslint-output.txt

      - name: Run Prettier check
        id: prettier
        continue-on-error: true
        run: |
          if npm run --silent | grep -q "format:check"; then
            npm run format:check 2>&1 | tee prettier-output.txt
          elif npm run --silent | grep -q "prettier"; then
            npm run prettier 2>&1 | tee prettier-output.txt
          else
            npx --yes prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}" 2>&1 | tee prettier-output.txt || true
          fi

      - name: Post Code Quality Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const eslintStatus = '${{ steps.eslint.outcome }}';
            const prettierStatus = '${{ steps.prettier.outcome }}';
            const body = `## Code Quality Report

            | Tool | Status |
            | --- | --- |
            | ESLint | ${eslintStatus === 'success' ? '✅ Passed' : '⚠️ Issues detected'} |
            | Prettier | ${prettierStatus === 'success' ? '✅ Passed' : '⚠️ Issues detected'} |

            - **ESLint** ran via \`npm run lint\` and analyzed JavaScript/TypeScript sources.
            - **Prettier** verified that source files are properly formatted.

            Please review any issues reported above and update the PR accordingly.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee test-output.txt

      - name: Generate coverage report
        id: coverage
        continue-on-error: true
        run: |
          if npm run --silent 2>&1 | grep -q "coverage"; then
            npm run coverage 2>&1 | tee coverage-output.txt || true
          else
            npx --yes jest --coverage 2>&1 | tee coverage-output.txt || true
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-output.txt
            test-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Test Coverage Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const testStatus = '${{ steps.tests.outcome }}';
            const coverageStatus = '${{ steps.coverage.outcome }}';
            const body = `## Test Coverage Report

            | Step | Status |
            | --- | --- |
            | Test Suite | ${testStatus === 'success' ? '✅ Passed' : '⚠️ Failed'} |
            | Coverage Generation | ${coverageStatus === 'success' ? '✅ Generated' : '⚠️ Skipped/Failed'} |

            - The full test suite was executed with \`npm test\`.
            - Coverage report has been uploaded as a workflow artifact (\`coverage-report\`).

            Download the artifact from the Actions run to inspect detailed coverage results.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Dependency vulnerability check
        id: audit
        continue-on-error: true
        run: |
          npm audit --json > audit-report.json 2>&1 || true
          npm audit 2>&1 | tee audit-output.txt || true

      - name: Secret scanning on changes
        id: secrets
        continue-on-error: true
        run: |
          set +e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff "$BASE_SHA" "$HEAD_SHA" > pr.diff || git diff HEAD~1 HEAD > pr.diff || true
          PATTERNS='(AKIA[0-9A-Z]{16}|AWS_SECRET_ACCESS_KEY|-----BEGIN (RSA|EC|DSA|OPENSSH|PRIVATE) KEY-----|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]+|api[_-]?key["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}|secret["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,})'
          if grep -E -i "$PATTERNS" pr.diff > secret-findings.txt; then
            echo "Potential secrets found in diff."
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "No secrets detected."
            echo "found=false" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Post Security Scan Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const auditStatus = '${{ steps.audit.outcome }}';
            const secretsFound = '${{ steps.secrets.outputs.found }}' === 'true';
            const body = `## Security Scan Report

            ### Dependencies
            - Dependency vulnerability scan: ${auditStatus === 'success' ? '✅ Completed' : '⚠️ Completed with warnings'}
            - Tool: \`npm audit\`

            ### Vulnerabilities
            - Detected dependency advisories are listed in the \`audit-output.txt\` log of this workflow run.
            - Review the full audit report to triage and patch any reported issues.

            ### Secret Scanning
            - Diff-based secret scan: ${secretsFound ? '🚨 Possible secrets detected — please review!' : '✅ No secrets detected in PR diff'}

            Address any reported Vulnerabilities or Dependencies issues before merging.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build application
        id: build
        continue-on-error: true
        run: |
          if npm run --silent 2>&1 | grep -q "^  build"; then
            npm run build 2>&1 | tee build-output.txt
          else
            echo "No build script defined; skipping explicit build." | tee build-output.txt
          fi

      - name: Validate endpoints
        id: endpoints
        continue-on-error: true
        run: |
          set +e
          (npm start &) >/dev/null 2>&1
          SERVER_PID=$!
          sleep 8
          ENDPOINTS=("/" "/health" "/api/health" "/api/status")
          echo "Endpoint validation results:" > endpoints-report.txt
          for ep in "${ENDPOINTS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000${ep}" || echo "000")
            echo "  ${ep} -> ${STATUS}" >> endpoints-report.txt
          done
          cat endpoints-report.txt
          kill $SERVER_PID 2>/dev/null || true
          exit 0

      - name: Create deployment preview artifacts
        if: always()
        run: |
          mkdir -p deployment-preview
          cp -r build-output.txt endpoints-report.txt deployment-preview/ 2>/dev/null || true
          [ -d dist ] && cp -r dist deployment-preview/ || true
          [ -d build ] && cp -r build deployment-preview/ || true
          echo "Deployment preview generated for commit ${{ github.event.pull_request.head.sha }}" \
            > deployment-preview/PREVIEW.md

      - name: Upload deployment preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: deployment-preview/
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Build Validation Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ steps.build.outcome }}';
            const endpointsStatus = '${{ steps.endpoints.outcome }}';
            const body = `## Build Validation

            | Step | Status |
            | --- | --- |
            | Application Build | ${buildStatus === 'success' ? '✅ Succeeded' : '⚠️ Failed/Skipped'} |
            | Endpoint Accessibility | ${endpointsStatus === 'success' ? '✅ Verified' : '⚠️ Failed'} |
            | Deployment Preview Artifact | 📦 Uploaded as \`deployment-preview\` |

            The application was built and its HTTP endpoints were probed for accessibility.
            A deployment preview artifact has been attached to this workflow run.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
