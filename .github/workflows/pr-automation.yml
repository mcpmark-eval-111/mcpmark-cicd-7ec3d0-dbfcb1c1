name: Pull Request Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: |
          echo "Running ESLint checks..."
          npm run lint 2>&1 | tee eslint-report.txt || echo "ESLint completed with warnings"
          echo "eslint_status=$?" >> $GITHUB_OUTPUT

      - name: Run Prettier check
        id: prettier
        continue-on-error: true
        run: |
          echo "Running Prettier formatting checks..."
          if npm run --silent format:check 2>/dev/null; then
            echo "Prettier check passed" | tee prettier-report.txt
          elif npx --yes prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}" --ignore-path .gitignore 2>&1 | tee prettier-report.txt; then
            echo "Prettier check completed"
          else
            echo "Prettier completed with warnings" | tee -a prettier-report.txt
          fi

      - name: Post Code Quality Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let eslintOutput = '';
            let prettierOutput = '';
            try { eslintOutput = fs.readFileSync('eslint-report.txt', 'utf8'); } catch (err) { eslintOutput = 'No ESLint output captured.'; }
            try { prettierOutput = fs.readFileSync('prettier-report.txt', 'utf8'); } catch (err) { prettierOutput = 'No Prettier output captured.'; }

            const truncate = (s, n) => (s && s.length > n) ? s.slice(0, n) + '
... (truncated)' : (s || '');
            const body = [
              '## 🧹 Code Quality Report',
              '',
              'Automated code quality checks completed for this pull request.',
              '',
              '### ESLint',
              '```',
              truncate(eslintOutput, 4000),
              '```',
              '',
              '### Prettier',
              '```',
              truncate(prettierOutput, 4000),
              '```',
              '',
              '_Generated by the `code-quality` job in pr-automation.yml_'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          echo "Running full test suite..."
          npm test 2>&1 | tee test-output.txt || echo "Tests completed with non-zero exit"

      - name: Generate coverage report
        id: coverage
        continue-on-error: true
        run: |
          echo "Generating coverage report..."
          if npm run --silent test:coverage 2>&1 | tee coverage-output.txt; then
            echo "Coverage generated via test:coverage script"
          else
            npx --yes jest --coverage 2>&1 | tee -a coverage-output.txt || echo "Coverage step completed with warnings"
          fi
          mkdir -p coverage
          if [ ! -f coverage/coverage-summary.json ]; then
            echo '{"total":{"lines":{"pct":0},"statements":{"pct":0},"functions":{"pct":0},"branches":{"pct":0}}}' > coverage/coverage-summary.json
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: |
            coverage/
            test-output.txt
            coverage-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Test Coverage Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let testOutput = '';
            let coverageOutput = '';
            try { testOutput = fs.readFileSync('test-output.txt', 'utf8'); } catch (err) { testOutput = 'No test output captured.'; }
            try { coverageOutput = fs.readFileSync('coverage-output.txt', 'utf8'); } catch (err) { coverageOutput = 'No coverage output captured.'; }

            const truncate = (s, n) => (s && s.length > n) ? s.slice(0, n) + '
... (truncated)' : (s || '');
            const body = [
              '## 🧪 Test Coverage Report',
              '',
              'Full test suite executed and coverage analyzed for this pull request.',
              '',
              '### Test Results',
              '```',
              truncate(testOutput, 4000),
              '```',
              '',
              '### Coverage Summary',
              '```',
              truncate(coverageOutput, 3000),
              '```',
              '',
              'Coverage artifacts have been uploaded and are available for download from the workflow run.',
              '',
              '_Generated by the `testing-suite` job in pr-automation.yml_'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Dependency vulnerability check
        id: audit
        continue-on-error: true
        run: |
          echo "Running dependency vulnerability checks..."
          npm audit --json > audit-report.json 2>/dev/null || echo "{}" > audit-report.json
          npm audit 2>&1 | tee audit-summary.txt || echo "npm audit completed with findings"

      - name: Scan for secrets in code changes
        id: secrets
        continue-on-error: true
        run: |
          echo "Scanning for secrets in code changes..."
          : > secrets-report.txt
          PATTERNS='(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_\-]{35}|ghp_[0-9A-Za-z]{36,}|gho_[0-9A-Za-z]{36,}|xox[baprs]-[0-9A-Za-z\-]{10,}|-----BEGIN (RSA|DSA|EC|OPENSSH|PGP) PRIVATE KEY-----|password\s*=\s*["'\''][^"'\'' ]{6,}["'\'']|secret\s*=\s*["'\''][^"'\'' ]{6,}["'\'']|api[_-]?key\s*=\s*["'\''][^"'\'' ]{6,}["'\''])'
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE_REF" --depth=1 || true
          if git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD || true)
          else
            CHANGED=$(git ls-files)
          fi
          if [ -z "$CHANGED" ]; then
            echo "No changed files detected." | tee -a secrets-report.txt
          else
            echo "Changed files scanned:" | tee -a secrets-report.txt
            echo "$CHANGED" | tee -a secrets-report.txt
            FOUND=0
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              [ -f "$FILE" ] || continue
              if grep -InE "$PATTERNS" "$FILE" >> secrets-report.txt 2>/dev/null; then
                FOUND=1
              fi
            done <<< "$CHANGED"
            if [ "$FOUND" -eq 0 ]; then
              echo "No secrets detected in changed files." | tee -a secrets-report.txt
            else
              echo "Potential secrets detected (see entries above)." | tee -a secrets-report.txt
            fi
          fi

      - name: Post Security Scan Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let auditSummary = '';
            let secretsReport = '';
            let auditJson = {};
            try { auditSummary = fs.readFileSync('audit-summary.txt', 'utf8'); } catch (err) { auditSummary = 'No audit summary available.'; }
            try { secretsReport = fs.readFileSync('secrets-report.txt', 'utf8'); } catch (err) { secretsReport = 'No secrets scan output captured.'; }
            try { auditJson = JSON.parse(fs.readFileSync('audit-report.json', 'utf8')); } catch (err) { auditJson = {}; }

            const meta = (auditJson && auditJson.metadata) || {};
            const vulns = (meta && meta.vulnerabilities) || {};
            const totalVulns = Object.values(vulns).reduce((acc, v) => acc + (typeof v === 'number' ? v : 0), 0);
            const totalDeps = (meta && meta.totalDependencies) || (meta && meta.dependencies) || 'unknown';

            const truncate = (s, n) => (s && s.length > n) ? s.slice(0, n) + '
... (truncated)' : (s || '');
            const body = [
              '## 🔒 Security Scan Report',
              '',
              'Automated security analysis for this pull request.',
              '',
              '### Vulnerabilities',
              '- Total vulnerabilities found: **' + totalVulns + '**',
              '- Critical: ' + (vulns.critical || 0) + ', High: ' + (vulns.high || 0) + ', Moderate: ' + (vulns.moderate || 0) + ', Low: ' + (vulns.low || 0) + ', Info: ' + (vulns.info || 0),
              '',
              '### Dependencies',
              '- Total dependencies scanned: **' + totalDeps + '**',
              '',
              '<details><summary>npm audit output</summary>',
              '',
              '```',
              truncate(auditSummary, 3500),
              '```',
              '',
              '</details>',
              '',
              '### Secret Scan',
              '```',
              truncate(secretsReport, 2500),
              '```',
              '',
              '_Generated by the `security-scan` job in pr-automation.yml_'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build application
        id: build
        continue-on-error: true
        run: |
          echo "Building application..."
          if npm run --silent build 2>&1 | tee build-output.txt; then
            echo "Build script completed."
          else
            echo "No build script defined or build completed with warnings." | tee -a build-output.txt
          fi
          mkdir -p deployment-preview
          cp -r src deployment-preview/src 2>/dev/null || true
          cp package.json deployment-preview/ 2>/dev/null || true
          [ -d dist ] && cp -r dist deployment-preview/dist 2>/dev/null || true
          [ -d build ] && cp -r build deployment-preview/build 2>/dev/null || true

      - name: Validate endpoints
        id: endpoints
        continue-on-error: true
        run: |
          echo "Validating endpoints..." | tee endpoints-report.txt
          PORT=3000
          # Try to start the application in the background
          (npm start >/tmp/app.log 2>&1 &) || true
          APP_PID=$!
          # Wait for server to come up
          for i in $(seq 1 20); do
            if curl -sSf "http://localhost:$PORT/" -o /dev/null 2>/dev/null \
               || curl -sSf "http://localhost:$PORT/health" -o /dev/null 2>/dev/null \
               || curl -sSf "http://localhost:$PORT/api" -o /dev/null 2>/dev/null; then
              echo "Server is up." | tee -a endpoints-report.txt
              break
            fi
            sleep 1
          done
          ENDPOINTS="/ /health /api /api/health /api/status"
          for EP in $ENDPOINTS; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$PORT$EP" || echo "000")
            echo "GET $EP -> HTTP $CODE" | tee -a endpoints-report.txt
          done
          # Cleanup background processes
          pkill -f "node" 2>/dev/null || true
          echo "Endpoint validation completed." | tee -a endpoints-report.txt

      - name: Upload deployment preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: |
            deployment-preview/
            build-output.txt
            endpoints-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Build Validation Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let buildOutput = '';
            let endpointsOutput = '';
            try { buildOutput = fs.readFileSync('build-output.txt', 'utf8'); } catch (err) { buildOutput = 'No build output captured.'; }
            try { endpointsOutput = fs.readFileSync('endpoints-report.txt', 'utf8'); } catch (err) { endpointsOutput = 'No endpoint validation output captured.'; }

            const truncate = (s, n) => (s && s.length > n) ? s.slice(0, n) + '
... (truncated)' : (s || '');
            const body = [
              '## 🏗️ Build Validation',
              '',
              'Build, endpoint validation, and deployment-preview artifact creation for this pull request.',
              '',
              '### Build Output',
              '```',
              truncate(buildOutput, 3500),
              '```',
              '',
              '### Endpoint Validation',
              '```',
              truncate(endpointsOutput, 2500),
              '```',
              '',
              'A `deployment-preview` artifact has been uploaded and is available for download from the workflow run.',
              '',
              '_Generated by the `build-validation` job in pr-automation.yml_'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
